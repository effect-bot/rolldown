name: Effect Service Shaking

# Fork-owned CI for `experimental.effectServiceShaking` (EFF-3430): one Linux
# job that runs the Effect service fixtures and the acceptance set. It builds
# only the integration test binary. The rest of Rolldown's CI (full integration
# suite, test262, other targets, lints) is intentionally not run here.

on:
  pull_request:
    branches:
      - effect-pinned-v1.3.0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  effect-service-shaking:
    name: Effect service fixtures and acceptance set (Linux, Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Fixtures resolve `effect`, `@effect/platform-node`, `@effect/ai-openai`
      # and `@distilled.cloud/stripe` from the root `node_modules`.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install the pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          key: effect-service-shaking

      # The `effect-verify` profile optimizes dependencies: every fixture
      # bundles the real `effect` package, which is parse-bound unoptimized.
      - name: Build the integration test binary
        run: cargo test --profile effect-verify -p rolldown --test integration --no-run

      - name: Effect service fixtures
        run: cargo test --profile effect-verify -p rolldown --test integration -- tree_shaking__effect_service

      - name: Acceptance set
        run: cargo test --profile effect-verify -p rolldown --test integration -- effect_service_acceptance --nocapture
