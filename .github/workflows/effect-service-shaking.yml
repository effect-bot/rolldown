name: Effect Service Shaking

# Fork-owned CI for `experimental.effectServiceShaking`, scoped to Effect's
# use case on Node: one Linux job that runs the Effect service fixtures and the
# real-Effect gates through the JS API. It builds only the integration test
# binary, the NAPI binding and the JS glue those checks need. The rest of
# Rolldown's CI (full integration suite, test262, other targets, lints) is
# intentionally not run here.

on:
  # PR runs only, so a push to the PR branch does not start a second run.
  pull_request:
    branches:
      - effect-pinned-v1.2.16
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  effect-service-shaking:
    name: Effect service fixtures and real-Effect gates (Linux, Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Fixtures resolve npm packages from the root, including `effect` for the
      # real-Effect gates.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install the pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          key: effect-service-shaking

      - name: Effect service fixtures (stub and real Effect)
        run: cargo test -p rolldown --test integration -- effect_service

      - name: Effect service snapshots are up to date
        run: |
          changes=$(git status --porcelain -- crates/rolldown/tests/rolldown/tree_shaking/effect_service crates/rolldown/tests/rolldown/tree_shaking/effect_service_real)
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff -- crates/rolldown/tests/rolldown/tree_shaking
            exit 1
          fi

      # Only the binding and the JS glue; the JS type check is not needed to
      # run the gates.
      - name: Build the NAPI binding (debug)
        run: pnpm --filter rolldown build-binding

      - name: Build the JS glue
        run: pnpm --filter rolldown build-node

      # Bundles the two real-Effect removal gates through the JS API with the
      # option on, then runs each gate's own `_test.mjs` (behaviour and removal
      # checks). Other `effect_service_real` fixtures are covered by the cargo
      # step above.
      - name: Real-Effect gates through the JS API
        run: |
          cat > run-gates.mjs <<'SCRIPT'
          import { rolldown } from './packages/rolldown/dist/index.mjs'
          import { execFileSync } from 'node:child_process'
          import fs from 'node:fs'
          import path from 'node:path'

          const root = 'crates/rolldown/tests/rolldown/tree_shaking/effect_service_real'
          for (const name of ['lifecycle', 'cross_module']) {
            const dir = path.resolve(root, name)
            const bundle = await rolldown({
              input: path.join(dir, 'main.js'),
              cwd: dir,
              platform: 'node',
              experimental: { effectServiceShaking: true },
            })
            await bundle.write({ dir: path.join(dir, 'dist'), format: 'esm' })
            await bundle.close()
            fs.writeFileSync(path.join(dir, 'dist', 'package.json'), '{ "type": "module" }')
            execFileSync(process.execPath, ['_test.mjs'], { cwd: dir, stdio: 'inherit' })
            console.log(`${name}: ok`)
          }
          SCRIPT
          node run-gates.mjs